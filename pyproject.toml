[project]
name = "jev"
version = "0.1.0"
description = "A guide-directed leveling agent for a private TBC server, that gets cheaper to run as it learns"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
# Perception. Image work only; the wire codec deliberately needs none of this so the
# whole radio format is testable with no capture, no client and no numpy.
eyes = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "windows-capture>=1.4; sys_platform == 'win32'",
    "mss>=9.0; sys_platform == 'win32'",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
